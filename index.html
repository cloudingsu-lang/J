<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Juliette</title>
    <link rel="stylesheet" href="design.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        /* Intro Scene Styles */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fdfcfb;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        .intro-text {
            font-family: 'Dancing Script', cursive;
            color: #ff4d6d; /* Made color slightly deeper for visibility */
            font-size: 2.5rem; /* Increased from 1.5rem to 2.5rem */
            font-weight: 700; /* Added bold weight */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1); /* Added subtle shadow */
            text-align: center;
            opacity: 0;
            position: absolute;
            transition: opacity 0.8s ease-in-out;
            padding: 20px;
            width: 90%; /* Ensures long text doesn't hit the screen edges */
        }

        /* Hide main container initially */
        .container {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .show-content {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-text" id="text1">Hey Juliette...</div>
        <div class="intro-text" id="text2">I wanted to tell you something.</div>
        <div class="intro-text" id="text3">Actually, it's 15 things. ❤️</div>
        <div class="intro-text" id="text3">Btw, Mwah</div>
    </div>

    <div class="container" id="main-container">
        <div class="card">
            <div class="icon-wrapper">
                <span class="floating-heart">❤️</span>
            </div>
            
            <h1>Hi Juliette!</h1>
            <div class="divider"></div>
            
            <p id="reason-display">Click the button below to see one of the many reasons why you're so special to me.</p>
            
            <button id="generate-btn">Tap for a Reason</button>
            
            <div class="footer-note">
                Made for you with ❤️
            </div>
        </div>
    </div>

    <script>
        // --- 3-Scene Intro Logic ---
        window.addEventListener('load', () => {
            const t1 = document.getElementById('text1');
            const t2 = document.getElementById('text2');
            const t3 = document.getElementById('text3');
            const overlay = document.getElementById('intro-overlay');
            const content = document.getElementById('main-container');

            // Scene 1: Show 1st text
            setTimeout(() => { t1.style.opacity = '1'; }, 500);
            // Hide 1st text
            setTimeout(() => { t1.style.opacity = '0'; }, 2500);

            // Scene 2: Show 2nd text
            setTimeout(() => { t2.style.opacity = '1'; }, 3500);
            // Hide 2nd text
            setTimeout(() => { t2.style.opacity = '0'; }, 5500);

            // Scene 3: Show 3rd text
            setTimeout(() => { t3.style.opacity = '1'; }, 6500);
            // Hide 3rd text
            setTimeout(() => { t3.style.opacity = '0'; }, 8500);

            // Final: Fade out overlay and show main content
            setTimeout(() => {
                overlay.style.opacity = '0';
                content.classList.add('show-content');
                setTimeout(() => { overlay.style.display = 'none'; }, 1000);
            }, 9500);
        });

        // --- Your Reasons Logic ---
        const reasons = [
            "The way your eyes sparkle when you're talking about something you love.",
            "How you sometime make my bad days better.",
            "How you like to study, which make me want to study too.",
            "The way you laugh at my jokes.",
            "Because you're the first person who tell me not to get drunk.",
            "How you like to read books.",
            "The way you call me Nico",
            "The way you force me to eat spicy noodles.",
            "\"Ama\" \"Bl ko ama ll!\"",
            "The way you act mad at me",
            "The way you always sending kpop lyrics to me",
            "How you like strawberries",
            "How you always try to tell me coffee suck",
            "The way you always make me smile when I saw you in school mornings",
            "They way knowing we love, though we don't need to say it to each other"
        ];

        let currentIndex = 0;
        const btn = document.getElementById('generate-btn');
        const display = document.getElementById('reason-display');

        btn.addEventListener('click', () => {
            const selectedReason = reasons[currentIndex];
            currentIndex = (currentIndex + 1) % reasons.length;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff758f', '#ff4d6d', '#ffffff']
            });

            display.style.transform = "scale(0.9)";
            display.style.opacity = "0";
            
            setTimeout(() => {
                display.innerText = selectedReason;
                display.style.transform = "scale(1)";
                display.style.opacity = "1";
            }, 200);
        });
    </script>
</body>
</html>
