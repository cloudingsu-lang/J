<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Juliette</title>
    <link rel="stylesheet" href="design.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        /* Intro Scene Styles */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdfcfb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        .loader-heart {
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        .intro-text {
            margin-top: 20px;
            font-family: 'Segoe UI', sans-serif;
            color: #ff758f;
            letter-spacing: 3px;
            font-weight: 300;
            text-transform: uppercase;
            animation: fadeInOut 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Hide the main container initially */
        .container {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .show-content {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="loader-heart">❤️</div>
        <div class="intro-text">Thinking of you...</div>
    </div>

    <div class="container" id="main-container">
        <div class="card">
            <div class="icon-wrapper">
                <span class="floating-heart">❤️</span>
            </div>
            
            <h1>Hi Juliette!</h1>
            <div class="divider"></div>
            
            <p id="reason-display">Click the button below to see one of the many reasons why you're so special to me.</p>
            
            <button id="generate-btn">Tap for a Reason</button>
            
            <div class="footer-note">
                Made for you with ❤️
            </div>
        </div>
    </div>

    <script>
        // --- Intro Scene Logic ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const overlay = document.getElementById('intro-overlay');
                const content = document.getElementById('main-container');
                
                overlay.style.opacity = '0';
                content.classList.add('show-content');
                
                // Remove overlay from DOM after fade out
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1000);
            }, 2500); // 2.5 seconds delay
        });

        // --- Your Reasons Logic ---
        const reasons = [
            "The way your eyes sparkle when you're talking about something you love.",
            "How you sometime make my bad days better.",
            "How you like to study, which make me want to study too.",
            "The way you laugh at my jokes.",
            "Because you're the first person who tell me not to get drunk.",
            "How you like to read books.",
            "The way you call me Nico",
            "The way you force me to eat spicy noodles.",
            "\"Ama\" \"Bl ko ama ll!\"",
            "The way you act mad at me",
            "The way you always sending kpop lyrics to me",
            "How you like strawberries",
            "How you always try to tell me coffee suck",
            "The way you always make me smile when I saw you in school mornings",
            "They way knowing we love, though we don't need to say it to each other"
        ];

        let currentIndex = 0;

        const btn = document.getElementById('generate-btn');
        const display = document.getElementById('reason-display');

        btn.addEventListener('click', () => {
            const selectedReason = reasons[currentIndex];
            currentIndex = (currentIndex + 1) % reasons.length;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff758f', '#ff4d6d', '#ffffff']
            });

            display.style.transform = "scale(0.9)";
            display.style.opacity = "0";
            
            setTimeout(() => {
                display.innerText = selectedReason;
                display.style.transform = "scale(1)";
                display.style.opacity = "1";
            }, 200);
        });
    </script>
</body>
</html>
